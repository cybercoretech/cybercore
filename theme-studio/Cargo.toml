[package]
name = "cybercore-theme-studio"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
description = "Standalone local theme creator for the Cybercore Systems Framework"
license = "MIT"
readme = "README.md"
repository = "https://github.com/cybercoretech/cybercore"
homepage = "https://cybercoretech.github.io/cybercore/"
keywords = ["cybercore", "themes", "theme-editor", "web"]
categories = ["command-line-utilities", "web-programming"]

[[bin]]
name = "cybercore-theme-studio"
path = "src/main.rs"

[dependencies]
axum = "0.7"
cybercore = { version = "0.8.2", path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
tower-http = { version = "0.6", features = ["fs"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
