[package]
name = "cybercore-theme-wasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Browser bindings for the Cybercore theme engine"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cybercore = { path = "..", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.129"
