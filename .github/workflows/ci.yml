name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: Minimum supported Rust (1.85)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85.0
      - name: Check workspace at the declared MSRV
        run: cargo check --workspace --all-targets --all-features

  test:
    name: Test and package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Generate GitHub Wiki gateway
        run: |
          python tools/generate-github-wiki.py --output "$RUNNER_TEMP/cybercore-wiki"
          python tools/generate-github-wiki.py --output "$RUNNER_TEMP/cybercore-wiki" --check

      - name: Check
        run: cargo check --workspace --all-targets --all-features

      - name: Check without optional features
        run: cargo check --workspace --all-targets

      - name: Test the browser core without filesystem support
        run: cargo test -p cybercore --no-default-features

      - name: Build browser bindings
        run: cargo build --locked -p cybercore-theme-wasm --target wasm32-unknown-unknown --release

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets --all-features

      - name: Enforce theme quality and pack validation gates
        run: |
          cargo run --locked --bin cybercore-theme -- check examples/fixtures/high-contrast-theme.json --strict
          cargo run --locked --bin cybercore-theme -- validate-pack examples/fixtures/release-pack.cyberpack.json

      - name: Test rustdoc
        run: cargo test --workspace --doc --all-features

      - name: Inspect package contents
        run: cargo package --list

      - name: Build packaged crate
        run: cargo package
