name: Consumer compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read

jobs:
  consumer:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Cyberdeck Hub
            repository: cybercoretech/cyberdeck-hub
            manifest: Cargo.toml
          - name: DaemonHall
            repository: cybercoretech/DaemonHall
            manifest: Cargo.toml
          - name: Cyberdesk
            repository: cybercoretech/cyberdesk
            manifest: Cargo.toml
          - name: Dockspace
            repository: cybercoretech/dockspace
            manifest: Cargo.toml
          - name: Cyberterm
            repository: cybercoretech/cyberterm
            manifest: Cargo.toml
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          path: consumer
          persist-credentials: false
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: consumer -> target
      - name: Test consumer against released Cybercore
        run: cargo test --locked --all-targets --manifest-path "consumer/${{ matrix.manifest }}"
