name: Sync theme chooser catalog

on:
  push:
    branches:
      - main
    paths:
      - "schema/themes/**/*.json"
      - "tools/generate-public-theme-chooser.py"
      - ".github/workflows/theme-catalog.yml"

permissions:
  contents: write

jobs:
  generate:
    name: Regenerate published theme catalog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate complete catalog
        run: python tools/generate-public-theme-chooser.py

      - name: Commit catalog when changed
        run: |
          if git diff --quiet -- docs/theme-chooser-data.json; then
            echo "Theme catalog is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/theme-chooser-data.json
          git commit -m "chore(themes): sync generated public catalog"
          git push
