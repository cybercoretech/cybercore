[package]
name = "cybercore"
version = "0.8.2"
edition = "2021"
rust-version = "1.85"
description = "Shared config schema, palette, design tokens, and path conventions for the Cybercore Systems Framework"
license = "MIT"
repository = "https://github.com/cybercoretech/cybercore"
homepage = "https://cybercoretech.github.io/cybercore/"
documentation = "https://docs.rs/cybercore"
readme = "README.md"
build = "build.rs"

include = [
    "/src/**",
    "/schema/**",
    "/css/**",
    "/web/**",
    "/tools/build-web-kit.sh",
    "/build.rs",
    "/examples/**",
    "/README.md",
    "/CHANGELOG.md",
    "/docs/**",
    "/LICENSE-MIT",
]

[lib]
name = "cybercore"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"], optional = true }
hostname = { version = "0.4", optional = true }

[features]
default = ["fs"]
# Native theme persistence; disable for browser / in-memory consumers.
fs = []
# Tool status contract: atomic per-tool status JSON (see src/status.rs).
status = ["dep:chrono", "dep:hostname"]

[[example]]
name = "publish_status"
required-features = ["status"]

[[bin]]
name = "cybercore-theme"
path = "src/bin/cybercore-theme.rs"
required-features = ["fs"]

[package.metadata.docs.rs]
all-features = true

[workspace]
members = [
    "crates/cybercore-core",
    "crates/cybercore-effects",
    "crates/cybercore-components",
    "crates/cybercore-publish",
    "crates/cybercore-updater",
    "crates/cybercore-update",
    "crates/cybercore-update-panel",
    "theme-studio",
    "wasm",
]
resolver = "2"

[build-dependencies]
serde_json = "1"
