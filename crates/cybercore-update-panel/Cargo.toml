[package]
name = "cybercore-update-panel"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Local Cybercore updater Control Panel"
license = "MIT"
repository = "https://github.com/cybercoretech/cybercore"

[dependencies]
axum = "0.7"
cybercore-updater = { path = "../cybercore-updater" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }

