[package]
name = "cybercore-update"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Cybercore updater TUI and local operator console"
license = "MIT"
repository = "https://github.com/cybercoretech/cybercore"

[dependencies]
cybercore-updater = { path = "../cybercore-updater" }
crossterm = "0.28"
ratatui = "0.29"

[[bin]]
name = "cybercore-update-tui"
path = "src/main.rs"
